name: WeWork Desk Booker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install playwright

      - name: Install Playwright browser + deps
        run: npx playwright install --with-deps chromium

      - name: Run booking script
        env:
          WEWORK_EMAIL: ${{ secrets.WEWORK_EMAIL }}
          WEWORK_PASSWORD: ${{ secrets.WEWORK_PASSWORD }}
        run: node bookDesk.js

      - name: Upload run artifacts (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-run-artifacts
          path: "*.png"
          if-no-files-found: ignore
